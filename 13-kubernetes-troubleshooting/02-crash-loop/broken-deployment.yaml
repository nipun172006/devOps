apiVersion: v1
kind: Namespace
metadata:
  name: troubleshooting-lab
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crashloop-demo
  namespace: troubleshooting-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: crashloop-demo
  template:
    metadata:
      labels:
        app: crashloop-demo
    spec:
      containers:
        - name: application
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              echo "Starting application with STARTUP_MODE=${STARTUP_MODE:-unset}"
              if [ "${STARTUP_MODE:-}" != "healthy" ]; then
                echo "FATAL: STARTUP_MODE must be healthy"
                exit 1
              fi
              while true; do sleep 3600; done
          env:
            - name: STARTUP_MODE
              value: broken
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              cpu: 50m
              memory: 32Mi
