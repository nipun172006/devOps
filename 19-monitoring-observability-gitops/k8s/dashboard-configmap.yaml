apiVersion: v1
kind: ConfigMap
metadata:
  name: module19-dashboard
  namespace: observability-lab
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/part-of: module19
data:
  module19-overview.json: |
    {
      "annotations": {"list": []},
      "editable": true,
      "graphTooltip": 0,
      "panels": [
        {
          "type": "stat",
          "title": "Requests / second",
          "gridPos": {"h": 5, "w": 8, "x": 0, "y": 0},
          "targets": [{"expr": "sum(rate(module19_http_requests_total[2m]))", "refId": "A"}],
          "fieldConfig": {"defaults": {"unit": "reqps"}, "overrides": []}
        },
        {
          "type": "timeseries",
          "title": "Request latency p95",
          "gridPos": {"h": 8, "w": 16, "x": 8, "y": 0},
          "targets": [{"expr": "histogram_quantile(0.95, sum(rate(module19_http_request_duration_seconds_bucket[2m])) by (le))", "refId": "A"}],
          "fieldConfig": {"defaults": {"unit": "s"}, "overrides": []}
        },
        {
          "type": "timeseries",
          "title": "Requests by status",
          "gridPos": {"h": 8, "w": 24, "x": 0, "y": 8},
          "targets": [{"expr": "sum(rate(module19_http_requests_total[2m])) by (status)", "legendFormat": "{{status}}", "refId": "A"}],
          "fieldConfig": {"defaults": {"unit": "reqps"}, "overrides": []}
        }
      ],
      "schemaVersion": 39,
      "title": "Module 19 API Overview",
      "uid": "module19-overview",
      "version": 1
    }
