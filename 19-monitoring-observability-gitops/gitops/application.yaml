apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: module19-observability
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: module19
spec:
  project: default
  source:
    repoURL: https://github.com/nipun172006/devOps.git
    targetRevision: main
    path: 19-monitoring-observability-gitops/k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: observability-lab
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
