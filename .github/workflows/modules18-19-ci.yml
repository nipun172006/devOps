name: Modules 18 and 19 CI

on:
  push:
    paths:
      - "18-cloud-terraform-in-action/**"
      - "19-monitoring-observability-gitops/**"
      - ".github/workflows/modules18-19-ci.yml"
  pull_request:
    paths:
      - "18-cloud-terraform-in-action/**"
      - "19-monitoring-observability-gitops/**"
      - ".github/workflows/modules18-19-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terraform:
    name: Module 18 Terraform checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 18-cloud-terraform-in-action
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8

      - name: Initialize without a backend
        run: terraform init -backend=false

      - name: Format and validate
        run: |
          terraform fmt -check -recursive
          terraform validate

      - name: Run Terraform tests
        run: terraform test

  application:
    name: Module 19 application checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 19-monitoring-observability-gitops
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: 19-monitoring-observability-gitops/requirements-dev.txt

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run application tests
        run: python -m pytest tests -q
