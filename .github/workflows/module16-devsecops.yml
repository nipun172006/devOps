name: Module 16 DevSecOps

on:
  push:
    paths:
      - "16-complete-cicd-devsecops/**"
      - ".github/workflows/module16-devsecops.yml"
  pull_request:
    paths:
      - "16-complete-cicd-devsecops/**"
      - ".github/workflows/module16-devsecops.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: module16-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MODULE_DIRECTORY: 16-complete-cicd-devsecops
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/devops-module16

jobs:
  quality:
    name: Quality and Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.MODULE_DIRECTORY }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: 16-complete-cicd-devsecops/requirements-dev.txt

      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run Ruff
        run: python -m ruff check app tests scripts

      - name: Run tests with coverage
        run: |
          mkdir -p reports
          python -m pytest tests -v \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml:reports/coverage.xml \
            --junitxml=reports/junit.xml

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: module16-test-reports
          path: 16-complete-cicd-devsecops/reports/
          if-no-files-found: warn

  sast:
    name: SAST - CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: python

      - name: Analyze source
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0

  supply-chain:
    name: SCA and Secret Scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.MODULE_DIRECTORY }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: 16-complete-cicd-devsecops/requirements-dev.txt

      - name: Install audit tooling
        run: python -m pip install -r requirements-dev.txt

      - name: Audit runtime dependencies
        run: python -m pip_audit -r requirements.txt --strict

      - name: Scan for committed secrets
        run: python scripts/secret_scan.py .

  container:
    name: Build, Scan, and Publish Image
    needs:
      - quality
      - sast
      - supply-chain
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Build image for security scan
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: 16-complete-cicd-devsecops
          load: true
          push: false
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Enforce Trivy vulnerability gate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish approved image
        if: github.event_name == 'push'
        run: |
          docker push "${IMAGE_NAME}:${GITHUB_SHA}"
          docker push "${IMAGE_NAME}:latest"

  release-manifest:
    name: Kubernetes Release Manifest
    needs:
      - container
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.MODULE_DIRECTORY }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Render immutable image tag
        run: |
          ./scripts/render_manifest.sh \
            "${IMAGE_NAME}:${GITHUB_SHA}" \
            build/k8s-release
          grep -n "image:" build/k8s-release/deployment.yaml

      - name: Upload Kubernetes release
        uses: actions/upload-artifact@v4
        with:
          name: module16-kubernetes-release
          path: 16-complete-cicd-devsecops/build/k8s-release/
          if-no-files-found: error
