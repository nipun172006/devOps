name: Module 15 CI

run-name: Module 15 CI - ${{ github.ref_name }} by @${{ github.actor }}

on:
  push:
    paths:
      - "15-cicd-github-actions/**"
      - ".github/workflows/module15-ci.yml"
  pull_request:
    paths:
      - "15-cicd-github-actions/**"
      - ".github/workflows/module15-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: module15-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  MODULE_DIR: 15-cicd-github-actions

jobs:
  lint:
    name: Lint Python
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: ${{ env.MODULE_DIR }}/requirements-dev.txt

      - name: Install dependencies
        working-directory: ${{ env.MODULE_DIR }}
        run: python -m pip install -r requirements-dev.txt

      - name: Run Ruff
        working-directory: ${{ env.MODULE_DIR }}
        run: ruff check app tests

  test:
    name: Test Application
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: ${{ env.MODULE_DIR }}/requirements-dev.txt

      - name: Install dependencies
        working-directory: ${{ env.MODULE_DIR }}
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests with coverage
        working-directory: ${{ env.MODULE_DIR }}
        run: |
          mkdir -p reports
          pytest tests -v \
            --junitxml=reports/junit.xml \
            --cov=app \
            --cov-report=xml:reports/coverage.xml \
            --cov-report=term-missing

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: module15-test-reports
          path: 15-cicd-github-actions/reports/
          if-no-files-found: warn
          retention-days: 7

  build:
    name: Build Artifact
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build application package
        working-directory: ${{ env.MODULE_DIR }}
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Upload application package
        uses: actions/upload-artifact@v4
        with:
          name: deployment-health-build
          path: |
            15-cicd-github-actions/build/*.tar.gz
            15-cicd-github-actions/build/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
