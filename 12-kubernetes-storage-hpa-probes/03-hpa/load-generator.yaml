apiVersion: v1
kind: Pod
metadata:
  name: load-generator
  namespace: autoscale-lab
  labels:
    app: load-generator
spec:
  containers:
    - name: load-generator
      image: busybox:1.36
      command:
        - /bin/sh
        - -c
        - while true; do wget -q -O- http://php-apache; done
      resources:
        requests:
          cpu: 10m
          memory: 8Mi
        limits:
          cpu: 200m
          memory: 32Mi
