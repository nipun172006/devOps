apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-stable
spec:
  replicas: 9
  selector:
    matchLabels:
      app: myapp-canary
      track: stable
  template:
    metadata:
      labels:
        app: myapp-canary
        track: stable
    spec:
      containers:
        - name: web
          image: hashicorp/http-echo:1.0
          args: ["-text=STABLE v1"]
          ports:
            - containerPort: 5678
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-canary
spec:
  replicas: 1
  selector:
    matchLabels:
      app: myapp-canary
      track: canary
  template:
    metadata:
      labels:
        app: myapp-canary
        track: canary
    spec:
      containers:
        - name: web
          image: hashicorp/http-echo:1.0
          args: ["-text=CANARY v2"]
          ports:
            - containerPort: 5678
